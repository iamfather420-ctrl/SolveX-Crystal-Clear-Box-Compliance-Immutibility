name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses5:i386 libstdc++6:i386 libgtk2.0-0:i386 libpangox-1.0-0:i386 libpangoxft-1.0-0:i386 libidn11:i386 zip unzip zlib1g-dev

    - name: Build APK with Buildozer
      uses: ArtemSuts/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SolveX-Crystal-Clear-Box
        path: bin/*.apk
